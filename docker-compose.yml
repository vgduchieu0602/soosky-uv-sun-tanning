# Deploy TEST/STAGING cho VPS Ubuntu RAM thấp.
#
# Đúng MỘT container. Không có MongoDB ở đây: MONGO_URI trong .env trỏ tới
# MongoDB bên ngoài (Atlas hoặc Mongo tự host).

services:
  api:
    build:
      context: .
    image: soosky-uv-sun-tanning:latest
    container_name: soosky-uv-sun-tanning
    restart: unless-stopped

    ports:
      # Cổng trên VPS: 3000 = plant-care, 3001 = storm, 3002 = weather-marine,
      # nên service này dùng 3003. Kiểm tra trước: sudo ss -ltnp | grep :3003
      # Bind loopback: chỉ nginx vào được, không lộ ra Internet.
      - "127.0.0.1:${HOST_PORT:-3003}:3000"

    env_file:
      - .env

    environment:
      # Cố định bên trong container, độc lập với HOST_PORT ở trên.
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "3000"
      # Trần V8 heap, để V8 gom rác trước khi kernel OOM-kill.
      # VPS 512MB -> 192 · 1GB -> 320 · 2GB+ -> 640
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-320}"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Trần RAM cuối, container không thể ăn hết VPS.
    mem_limit: ${MEM_LIMIT:-400m}
    memswap_limit: ${MEM_LIMIT:-400m}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
